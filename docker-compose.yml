services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend:/app
      - BRAIN_URL=http://brain:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - brain

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
