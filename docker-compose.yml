services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend:/app
      - BRAIN_URL=http://brain:8001
    depends_on:
      - brain

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
